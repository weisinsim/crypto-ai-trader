name: Manual Five-Coin Historical Research Batch

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "UTC start date, inclusive (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-04-01"
      end_date:
        description: "UTC end date, exclusive (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-01"
      interval:
        description: "Baseline candle interval"
        required: true
        type: choice
        options:
          - "1h"
          - "4h"
        default: "1h"

permissions:
  contents: read

concurrency:
  group: five-coin-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Validate date inputs
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          start = date.fromisoformat(os.environ["START_DATE"])
          end = date.fromisoformat(os.environ["END_DATE"])
          if start >= end:
              raise SystemExit("start_date must be earlier than end_date")
          print(f"UTC range: [{start.isoformat()}, {end.isoformat()})")
          PY

      - name: Download candles, funding, audit and baseline for each asset
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          set -uo pipefail
          mkdir -p reports data/research_batch
          printf 'symbol,interval,candle_status,funding_download_status,funding_audit_status,baseline_status\n' > reports/batch_summary.csv
          batch_failed=0
          for symbol in BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT; do
            candle_status=FAILED
            funding_status=FAILED
            audit_status=FAILED
            baseline_status=FAILED

            echo "::group::${symbol} candles"
            if python -m research.binance_data \
              --symbol "${symbol}" --interval "${INTERVAL}" \
              --start "${START_DATE}" --end "${END_DATE}" \
              --output "data/research_batch/${symbol}_${INTERVAL}.csv"; then
              candle_status=COMPLETE
            else
              batch_failed=1
            fi
            echo "::endgroup::"

            if [[ "${candle_status}" == COMPLETE ]]; then
              echo "::group::${symbol} funding history"
              if python -m research.binance_funding_data \
                --symbol "${symbol}" --start "${START_DATE}" --end "${END_DATE}" \
                --output "data/research_batch/${symbol}_funding.csv"; then
                funding_status=DOWNLOADED_NOT_RECONCILED
              else
                batch_failed=1
              fi
              echo "::endgroup::"
            fi

            if [[ "${candle_status}" == COMPLETE && "${funding_status}" != FAILED ]]; then
              echo "::group::${symbol} funding timestamp audit"
              if python -m research.audit_funding_data \
                --candles "data/research_batch/${symbol}_${INTERVAL}.csv" \
                --funding-csv "data/research_batch/${symbol}_funding.csv" \
                --symbol "${symbol}" --interval "${INTERVAL}" \
                --max-gap-hours 12 --output "reports/${symbol}_funding_audit.json"; then
                audit_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "UNKNOWN"))' "reports/${symbol}_funding_audit.json" 2>/dev/null || echo UNKNOWN)"
                if grep -qi 'proxy' "data/research_batch/${symbol}_funding.csv"; then
                  funding_status=DOWNLOADED_PROXY_MARK_PRICE_NOT_RECONCILED
                fi
              else
                batch_failed=1
              fi
              echo "::endgroup::"
            fi

            if [[ "${candle_status}" == COMPLETE && "${funding_status}" != FAILED ]]; then
              echo "::group::${symbol} baseline research backtest"
              if python -m research.run_backtest \
                --csv "data/research_batch/${symbol}_${INTERVAL}.csv" \
                --symbol "${symbol}" --interval "${INTERVAL}" \
                --funding-csv "data/research_batch/${symbol}_funding.csv" \
                --output "reports/${symbol}_${INTERVAL}_baseline.json"; then
                baseline_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "UNKNOWN"))' "reports/${symbol}_${INTERVAL}_baseline.json" 2>/dev/null || echo UNKNOWN)"
              else
                batch_failed=1
              fi
              echo "::endgroup::"
            fi

            printf '%s,%s,%s,%s,%s,%s\n' "${symbol}" "${INTERVAL}" "${candle_status}" "${funding_status}" "${audit_status}" "${baseline_status}" >> reports/batch_summary.csv
            echo "summary ${symbol}: candles=${candle_status} funding=${funding_status} audit=${audit_status} baseline=${baseline_status}"
          done
          if [[ "${batch_failed}" -ne 0 ]]; then
            echo "One or more asset stages failed; manifest and artifacts will still be generated."
            exit 1
          fi

      - name: Build manifest and research-only summary
        if: always()
        run: python -m research.build_research_manifest --summary reports/batch_summary.csv --output reports/research_batch_manifest.json

      - name: Upload research reports and input fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-coin-historical-research-${{ inputs.start_date }}-to-${{ inputs.end_date }}-${{ inputs.interval }}
          path: |
            reports/
            data/research_batch/
          if-no-files-found: warn
          retention-days: 30

name: Manual Five-Coin Historical Research Batch

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "UTC start date, inclusive (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-04-01"
      end_date:
        description: "UTC end date, exclusive (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-01"
      interval:
        description: "Baseline candle interval"
        required: true
        type: choice
        options:
          - "1h"
          - "4h"
        default: "1h"

permissions:
  contents: read

concurrency:
  group: five-coin-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Validate date inputs
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          start = date.fromisoformat(os.environ["START_DATE"])
          end = date.fromisoformat(os.environ["END_DATE"])
          if start >= end:
              raise SystemExit("start_date must be earlier than end_date")
          print(f"UTC range: [{start.isoformat()}, {end.isoformat()})")
          PY

      - name: Download candles, funding, audit and baseline for each asset
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          set -euo pipefail
          mkdir -p reports data/research_batch
          printf 'symbol,interval,candle_status,funding_download_status,funding_audit_status,baseline_status\n' > reports/batch_summary.csv
          for symbol in BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT; do
            echo "::group::${symbol} candles"
            python -m research.binance_data \
              --symbol "${symbol}" --interval "${INTERVAL}" \
              --start "${START_DATE}" --end "${END_DATE}" \
              --output "data/research_batch/${symbol}_${INTERVAL}.csv"
            echo "::endgroup::"

            echo "::group::${symbol} funding history"
            python -m research.binance_funding_data \
              --symbol "${symbol}" --start "${START_DATE}" --end "${END_DATE}" \
              --output "data/research_batch/${symbol}_funding.csv"
            echo "::endgroup::"

            echo "::group::${symbol} funding timestamp audit"
            python -m research.audit_funding_data \
              --candles "data/research_batch/${symbol}_${INTERVAL}.csv" \
              --funding-csv "data/research_batch/${symbol}_funding.csv" \
              --symbol "${symbol}" --interval "${INTERVAL}" \
              --max-gap-hours 12 \
              --output "reports/${symbol}_funding_audit.json"
            echo "::endgroup::"

            echo "::group::${symbol} baseline research backtest"
            python -m research.run_backtest \
              --csv "data/research_batch/${symbol}_${INTERVAL}.csv" \
              --symbol "${symbol}" --interval "${INTERVAL}" \
              --funding-csv "data/research_batch/${symbol}_funding.csv" \
              --output "reports/${symbol}_${INTERVAL}_baseline.json"
            echo "::endgroup::"

            python - "${symbol}" "${INTERVAL}" <<'PY' >> reports/batch_summary.csv
          import json, sys
          symbol, interval = sys.argv[1:]
          audit = json.load(open(f"reports/{symbol}_funding_audit.json", encoding="utf-8"))
          report = json.load(open(f"reports/{symbol}_{interval}_baseline.json", encoding="utf-8"))
          sources = audit.get("funding", {}).get("source_labels", [])
          proxy_used = any("proxy" in source.lower() for source in sources)
          funding_status = "DOWNLOADED_PROXY_MARK_PRICE_NOT_RECONCILED" if proxy_used else "DOWNLOADED_NOT_RECONCILED"
          audit_status = audit.get("status", "UNKNOWN")
          backtest_status = report.get("status", "UNKNOWN")
          print(f"{symbol},{interval},COMPLETE,{funding_status},{audit_status},{backtest_status}")
          PY
          done

      - name: Build manifest and research-only summary
        if: always()
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          summary = Path("reports/batch_summary.csv")
          rows = []
          if summary.exists():
              with summary.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
          expected_assets = 5
          all_assets_processed = len(rows) == expected_assets
          any_audit_review = any(
              row.get("funding_audit_status") == "REVIEW_REQUIRED" for row in rows
          )
          any_proxy = any(
              "PROXY" in row.get("funding_download_status", "").upper()
              for row in rows
          )
          if not all_assets_processed:
              batch_completion_status = "PARTIAL_OR_FAILED"
          elif any_audit_review:
              batch_completion_status = "ALL_ASSETS_PROCESSED_REVIEW_REQUIRED"
          else:
              batch_completion_status = "ALL_ASSETS_PROCESSED_NOT_RECONCILED"
          if any_proxy:
              funding_data_quality_status = "PROXY_MARKS_NOT_SETTLEMENT_REVIEW_REQUIRED"
          elif any_audit_review:
              funding_data_quality_status = "FUNDING_AUDIT_REVIEW_REQUIRED"
          else:
              funding_data_quality_status = "TIMESTAMP_ALIGNMENT_ONLY_NOT_RECONCILED"
          payload = {
              "status": "RESEARCH_ONLY",
              "batch_completion_status": batch_completion_status,
              "funding_data_quality_status": funding_data_quality_status,
              "funding_proxy_review_required": any_proxy,
              "profitability_claim_eligible": False,
              "expected_assets": expected_assets,
              "strategy_approval": False,
              "live_trading_enabled": False,
              "funding_gap_review_threshold_hours": 12,
              "interpretation": (
                  "EMA baseline is a data-pipeline smoke test, not the asset-adaptive dashboard model. "
                  "Funding gaps exceeding 12 hours are flagged for review; this threshold is a diagnostic, not proof of complete event coverage. "
                  "Funding download is not cashflow reconciliation; audit alignment is not proof of complete coverage. "
                  "When proxy marks are used, funding_data_quality_status explicitly requires review because the proxy is not the actual settlement mark. "
                  "These outputs are exploratory only and are not eligible for profitability claims or strategy promotion."
              ),
              "rows_completed": len(rows),
              "funding_proxy_used": any_proxy,
              "assets": rows,
          }
          Path("reports/research_batch_manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload research reports and input fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-coin-historical-research-${{ inputs.start_date }}-to-${{ inputs.end_date }}-${{ inputs.interval }}
          path: |
            reports/
            data/research_batch/
          if-no-files-found: warn
          retention-days: 30

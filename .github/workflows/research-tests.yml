name: Research test suite

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "tests/**"
      - "app.py"
      - ".github/workflows/research-tests.yml"
  pull_request:
    paths:
      - "research/**"
      - "tests/**"
      - "app.py"
      - ".github/workflows/research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v12-focused:
    name: V12 focused tests and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pytest
      - name: Run V12 hybrid unit tests
        run: python -m pytest -q tests/test_v12_hybrid_engine.py tests/test_v12_backtest.py
      - name: Compile application and research modules
        run: python -m compileall -q app.py research validation tests

  full-suite:
    name: Full repository test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest httpx
      - name: Run all unit tests
        run: python -m pytest -q

name: Research test suite

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "tests/**"
      - ".github/workflows/research-tests.yml"
  pull_request:
    paths:
      - "research/**"
      - "tests/**"
      - ".github/workflows/research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest httpx
      - name: Run unit tests
        run: python -m pytest -q

name: Historical baseline research

on:
  # Multi-asset historical sweeps are expensive; keep code-push checks fast.
  # Run the full research manually or on a weekly schedule.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "UTC history length (days)"
        required: true
        default: "365"
        type: choice
        options:
          - "90"
          - "180"
          - "365"

permissions:
  contents: read

concurrency:
  group: historical-baseline-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: ${{ matrix.symbol }} 1H baseline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, AVAXUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install httpx
      - name: Download complete closed-candle history
        env:
          SYMBOL: ${{ matrix.symbol }}
          DAYS: ${{ inputs.days || '365' }}
        run: |
          # Public archives may publish the latest UTC day with a delay.
          # Use the last fully closed UTC day as the exclusive end boundary.
          END="$(date -u -d "3 days ago" +%F)"
          START="$(date -u -d "$END -${DAYS} days" +%F)"
          python -m research.binance_archive_data \
            --symbol "$SYMBOL" --interval 1h \
            --start "$START" --end "$END" \
            --output "data/${SYMBOL}_1h.csv"
      - name: Verify candle manifest matches downloaded CSV
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          symbol = os.environ["SYMBOL"]
          csv_path = Path(f"data/{symbol}_1h.csv")
          manifest_path = csv_path.with_suffix(csv_path.suffix + ".manifest.json")
          if not csv_path.is_file() or not manifest_path.is_file():
              raise SystemExit("Candle CSV or its manifest is missing.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload = csv_path.read_bytes()
          rows = list(csv.DictReader(payload.decode("utf-8").splitlines()))
          errors = []
          if manifest.get("symbol") != symbol:
              errors.append("symbol mismatch")
          if manifest.get("interval") != "1h":
              errors.append("interval mismatch")
          if manifest.get("bars") != len(rows):
              errors.append("bar count mismatch")
          if manifest.get("file", {}).get("sha256") != hashlib.sha256(payload).hexdigest():
              errors.append("SHA-256 mismatch")
          if manifest.get("file", {}).get("size_bytes") != len(payload):
              errors.append("file size mismatch")
          if manifest.get("source_authenticity_verified") is not False:
              errors.append("manifest must not claim source authenticity is verified")
          evidence = manifest.get("request_evidence", {})
          requests = evidence.get("requests", [])
          if evidence.get("request_count") != len(requests):
              errors.append("request evidence count mismatch")
          if not requests:
              errors.append("request evidence is empty")
          for index, request in enumerate(requests):
              if request.get("status_code") not in range(100, 600):
                  errors.append(f"request {index} has invalid HTTP status")
              if request.get("payload_bytes", -1) < 0:
                  errors.append(f"request {index} has invalid payload size")
              digest = request.get("payload_sha256", "")
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  errors.append(f"request {index} has invalid SHA-256")
              if not request.get("source") or not request.get("url", "").startswith("https://"):
                  errors.append(f"request {index} is missing source or HTTPS URL")
          if errors:
              raise SystemExit("Candle manifest verification failed: " + "; ".join(errors))
          print(json.dumps({
              "status": "PASS",
              "symbol": symbol,
              "bars": len(rows),
              "sha256": manifest["file"]["sha256"],
              "source_authenticity_verified": False,
              "request_count": evidence["request_count"],
              "request_sources": sorted({request["source"] for request in requests}),
          }, indent=2))
          PY
      - name: Download historical funding rates
        continue-on-error: true
        env:
          SYMBOL: ${{ matrix.symbol }}
          DAYS: ${{ inputs.days || '365' }}
        run: |
          END="$(date -u -d "3 days ago" +%F)"
          START="$(date -u -d "$END -${DAYS} days" +%F)"
          START_MS="$(date -u -d "$START" +%s000)"
          END_MS="$(date -u -d "$END" +%s000)"
          python -m research.funding_data \
            --symbol "$SYMBOL" --start-ms "$START_MS" --end-ms "$END_MS" \
            --output "data/${SYMBOL}_funding.csv"
      - name: Audit historical funding coverage and price provenance
        run: |
          test -s "data/${{ matrix.symbol }}_funding.csv" || { echo "::error::Funding data missing; refusing to treat this run as fully comparable."; exit 1; }
          python -m research.funding_audit \
            --funding-csv "data/${{ matrix.symbol }}_funding.csv" \
            --candle-csv "data/${{ matrix.symbol }}_1h.csv" \
            --symbol "${{ matrix.symbol }}" \
            --output "reports/${{ matrix.symbol }}_funding_audit.json"
      - name: Enforce funding audit gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/${{ matrix.symbol }}_funding_audit.json").read_text())
          summary = {key: report.get(key) for key in ("symbol", "status", "funding_records", "proxy_price_records", "unverified_price_source_records", "gaps_over_8h")}
          print(json.dumps(summary, indent=2))
          if report.get("status") != "PASS":
              raise SystemExit("Funding audit failed; downstream strategy metrics must not be treated as comparable.")
          PY
      - name: Benchmark public strategy archetypes (diagnostic; funding excluded)
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python -m research.public_strategy_benchmark \
            --csv "data/${SYMBOL}_1h.csv" \
            --symbol "${SYMBOL}" \
            --funding-csv "data/${SYMBOL}_funding.csv" \
            --output "reports/${SYMBOL}_1h_public_strategy_benchmark.json"
      - name: Diagnose funding and candle timestamp grids
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import csv, os
          from datetime import datetime, timezone
          from pathlib import Path
          symbol = os.environ["SYMBOL"]
          candles = list(csv.DictReader(Path(f"data/{symbol}_1h.csv").open()))
          funding = list(csv.DictReader(Path(f"data/{symbol}_funding.csv").open()))
          candle_ts = [int(row["t"]) for row in candles]
          funding_ts = [int(row["funding_time"]) for row in funding]
          print(f"=== TIMESTAMP GRID DIAGNOSTIC {symbol} ===")
          print(f"candle_count={len(candle_ts)} funding_count={len(funding_ts)}")
          def show(label, values):
              print(label)
              for ts in values:
                  print(f"  raw_ms={ts} utc={datetime.fromtimestamp(ts/1000, timezone.utc).isoformat()} modulo_hour={ts % 3600000}")
          show("candle_first", candle_ts[:3])
          show("candle_last", candle_ts[-3:])
          show("funding_first", funding_ts[:3])
          show("funding_last", funding_ts[-3:])
          print("funding_nearest_candle_delta_ms:")
          for ts in funding_ts[:10]:
              nearest = min(candle_ts, key=lambda value: abs(value-ts))
              print(f"  funding={ts} nearest={nearest} delta_ms={nearest-ts}")
          PY
      - name: Run research-only baseline and walk-forward report
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python -m research.run_backtest \
            --csv "data/${SYMBOL}_1h.csv" \
            --symbol "$SYMBOL" --interval 1h \
            --train-fraction 0.6 --folds 4 \
            --funding-csv "data/${SYMBOL}_funding.csv" \
            --output "reports/${SYMBOL}_1h_baseline.json"
      - name: Print compact metrics for review
        if: success()
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(f"reports/{__import__('os').environ['SYMBOL']}_1h_baseline.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          holdout = report["holdout"]
          print("=== RESEARCH SUMMARY (NOT A PRODUCTION CERTIFICATION) ===")
          print(f"symbol={report['symbol']} interval={report['interval']} bars={report['bars']}")
          print(f"funding_records={report['funding_data']['records']} funding_source={report['funding_data']['source']}")
          print(f"holdout_trades={holdout['trades']} net_return_pct={holdout['net_return_pct']}")
          print(f"holdout_max_drawdown_pct={holdout['max_drawdown_pct']} win_rate_pct={holdout['win_rate_pct']}")
          print(f"holdout_profit_factor={holdout['profit_factor']} expectancy_equity_pct={holdout['expectancy_equity_pct']}")
          for fold in report["walk_forward"]:
              print(
                  f"fold={fold['fold']} bars={fold['bars']} trades={fold['trades']} "
                  f"net_return_pct={fold['net_return_pct']} max_drawdown_pct={fold['max_drawdown_pct']} "
                  f"win_rate_pct={fold['win_rate_pct']} profit_factor={fold['profit_factor']}"
              )
          stress = report["walk_forward_cost_stress_summary"]
          print("=== WALK-FORWARD COST ROBUSTNESS SUMMARY (RESEARCH ONLY) ===")
          print(f"fold_count={stress['fold_count']} passing_all_cost_scenarios={stress['folds_passing_all_three_cost_scenarios']} missing_stress={stress['folds_with_missing_cost_stress']}")
          for scenario, metrics in stress["scenario_summary"].items():
              print(
                  f"scenario={scenario} completed={metrics['folds_completed']}/{metrics['folds_reported']} "
                  f"positive_folds={metrics['folds_positive_return']} "
                  f"pf_above_1_15_folds={metrics['folds_pf_above_1_15']} "
                  f"worst_return_pct={metrics['worst_net_return_pct']} "
                  f"worst_drawdown_pct={metrics['worst_max_drawdown_pct']} "
                  f"lowest_numeric_pf={metrics['lowest_numeric_profit_factor']}"
              )
          print(f"production_approval={stress['production_approval']}")
          gate = stress["walk_forward_candidate_gate"]
          print("=== WALK-FORWARD CANDIDATE GATE (RESEARCH ONLY) ===")
          print(
              f"pass={gate['pass']} min_trades_per_fold={gate['minimum_trades_per_fold']} "
              f"under_sampled_folds={gate['under_sampled_folds']} "
              f"all_folds_stress_pass={gate['all_folds_stress_pass']} "
              f"missing_stress_folds={gate['missing_cost_stress_folds']} promotion={gate['promotion']}"
          )
          if gate["pass"]:
              print("NOTE: candidate gate passed only this research screen; it is not a production approval.")
          if report["funding_data"]["records"] == 0:
              print("WARN: historical funding unavailable; baseline excludes realized funding cashflows.")
          else:
              print("INFO: historical funding CSV supplied to baseline backtest.")
          PY
      - name: Run train-only adaptive parameter sweep
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python -m research.adaptive_model_sweep \
            --csv "data/${SYMBOL}_1h.csv" \
            --symbol "${SYMBOL}" --interval 1h \
            --train-fraction 0.6 \
            --funding-csv "data/${SYMBOL}_funding.csv" \
            --output "reports/${SYMBOL}_1h_adaptive.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          symbol = os.environ["SYMBOL"]
          report = json.loads(Path(f"reports/{symbol}_1h_adaptive.json").read_text())
          print("=== ADAPTIVE SWEEP (TRAIN-ONLY SELECTION) ===")
          print(f"symbol={symbol} candidates={report['candidate_count']} eligible={report['eligible_count']}")
          print(f"selected_parameters={report['selected_parameters']}")
          print(f"training_selection_metrics={report['training_selection_metrics']}")
          print(f"holdout={report['holdout']}")
          funding_count = report["costs"].get("funding_records", 0)
          print(f"funding_records={funding_count} funding_status={report['costs'].get('funding')}")
          if funding_count <= 0:
              raise SystemExit("ERROR: adaptive sweep did not include historical funding; refusing comparable result.")
          print("STATUS: research-only; funding mark-price provenance and intrabar settlement ordering still require audit.")
          PY
      - name: Run breakout-retest-confirmation research
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          test -s "data/${SYMBOL}_funding.csv" || { echo "::error::Historical funding file missing; refusing a non-comparable breakout/retest promotion run."; exit 1; }
          python -m research.breakout_retest \
            --csv "data/${SYMBOL}_1h.csv" \
            --symbol "${SYMBOL}" --interval 1h \
            --train-fraction 0.6 \
            --funding-csv "data/${SYMBOL}_funding.csv" \
            --output "reports/${SYMBOL}_1h_breakout_retest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["SYMBOL"]
          report = json.loads(Path(f"reports/{symbol}_1h_breakout_retest.json").read_text())
          print("=== BREAKOUT/RETEST CANDIDATE DIAGNOSTICS ===")
          print(f"symbol={symbol} candidates={report['candidate_count']} eligible={report['eligible_count']}")
          print(f"rejection_reason_counts={report['rejection_reason_counts']}")
          for candidate in report["candidate_diagnostics"][:5]:
              print(
                  f"params={candidate['parameters']} eligible={candidate['eligible']} "
                  f"median_fold_return_pct={candidate['median_fold_return_pct']} "
                  f"median_fold_drawdown_pct={candidate['median_fold_drawdown_pct']} "
                  f"positive_folds={candidate['positive_folds']} "
                  f"worst_fold_return_pct={candidate['worst_fold_return_pct']} "
                  f"score={candidate['score']} "
                  f"rejection_reasons={candidate['rejection_reasons']} "
                  f"folds={[{k: fold.get(k) for k in ('trades', 'net_return_pct', 'max_drawdown_pct', 'win_rate_pct', 'profit_factor')} for fold in candidate['folds']]}"
              )
          print(f"selected_parameters={report['selected_parameters']}")
          print(f"holdout={report['holdout']}")
          print(f"stress_holdout={report['stress_holdout_0_30pct_round_trip']}")
          print(f"severe_holdout={report['severe_holdout_0_46pct_round_trip']}")
          print(f"funding_data={report['funding_data']}")
          print(f"cost_robustness_gate={report['cost_robustness_gate']}")
          PY
      - name: Run mean-reversion research
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          if [ -s "data/${SYMBOL}_funding.csv" ]; then
            echo "Historical funding available; applying funding cashflows."
            python -m research.mean_reversion \
              --csv "data/${SYMBOL}_1h.csv" \
              --symbol "${SYMBOL}" --interval 1h \
              --train-fraction 0.6 \
              --funding-csv "data/${SYMBOL}_funding.csv" \
              --output "reports/${SYMBOL}_1h_mean_reversion.json"
          else
            echo "::warning::Historical funding unavailable (possibly exchange API jurisdiction restriction); running explicitly unfunded research only."
            python -m research.mean_reversion \
              --csv "data/${SYMBOL}_1h.csv" \
              --symbol "${SYMBOL}" --interval 1h \
              --train-fraction 0.6 \
              --output "reports/${SYMBOL}_1h_mean_reversion.json"
          fi
      - name: Print mean-reversion research summary
        if: success()
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["SYMBOL"]
          report = json.loads(Path(f"reports/{symbol}_1h_mean_reversion.json").read_text())
          print("=== MEAN REVERSION (RESEARCH ONLY) ===")
          print(f"symbol={symbol} candidates={report['candidate_count']} eligible={report['eligible_count']}")
          print(f"selected_parameters={report['selected_parameters']}")
          print(f"holdout={report['holdout']}")
          print(f"stress_holdout={report['stress_holdout_0_30pct_round_trip']}")
          PY
      - name: Run frozen-parameter stability and cost stress diagnostic
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python -m research.frozen_parameter_stability \
            --csv "data/${SYMBOL}_1h.csv" \
            --symbol "${SYMBOL}" --train-fraction 0.6 \
            --funding-csv "data/${SYMBOL}_funding.csv" \
            --params-json "reports/${SYMBOL}_1h_mean_reversion.json" \
            --output "reports/${SYMBOL}_1h_frozen_stability.json"
      - name: Print frozen direction and monthly diagnostics
        if: success()
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["SYMBOL"]
          path = Path(f"reports/{symbol}_1h_frozen_stability.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"=== FROZEN STABILITY DIAGNOSTICS {symbol} ===")
          print(f"status={report.get('status')} bars={report.get('bars')} holdout_bars={report.get('holdout_bars')}")
          for direction, costs in report.get("direction_sensitivity_same_holdout_not_for_selection", {}).items():
              for cost_name, metrics in costs.items():
                  print(f"direction={direction} cost={cost_name} trades={metrics.get('trades')} net_return_pct={metrics.get('net_return_pct')} max_drawdown_pct={metrics.get('max_drawdown_pct')} win_rate_pct={metrics.get('win_rate_pct')} profit_factor={metrics.get('profit_factor')}")
          for cost_name, months in report.get("monthly_trade_diagnostics", {}).items():
              for month, metrics in months.items():
                  print(f"monthly cost={cost_name} month={month} trades={metrics.get('trades')} net_pnl_equity_pct={metrics.get('net_pnl_equity_pct')} win_rate_pct={metrics.get('win_rate_pct')} profit_factor={metrics.get('profit_factor')} exit_reasons={metrics.get('exit_reasons')}")
          print("WARNING: same-holdout direction results are diagnostic only and must not be used to select a trading direction.")
          PY
      - name: Run AVAX frozen-parameter follow-up diagnostics
        if: matrix.symbol == 'AVAXUSDT'
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          test -s "data/${SYMBOL}_funding.csv" || { echo "::error::AVAX follow-up requires historical funding data."; exit 1; }
          python -m research.avax_followup_diagnostics \
            --csv "data/${SYMBOL}_1h.csv" \
            --symbol "${SYMBOL}" \
            --funding-csv "data/${SYMBOL}_funding.csv" \
            --params-json "reports/${SYMBOL}_1h_mean_reversion.json" \
            --train-fraction 0.6 \
            --output "reports/${SYMBOL}_1h_avax_followup.json"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/AVAXUSDT_1h_avax_followup.json").read_text())
          print("=== AVAX FOLLOW-UP (RESEARCH ONLY) ===")
          print(f"parameter_neighborhood_rows={len(report['train_only_parameter_neighborhood'])}")
          print(f"holdout_half_cost_rows={len(report['chronological_holdout_halves'])}")
          print(f"production_gate={report['production_gate']}")
          for item in report["chronological_holdout_halves"]:
              m = item["metrics"]
              concentration = item["trade_pnl_concentration"]["positive_pnl_trade_concentration"]
              print(f"holdout_half={item['half']} cost={item['cost_scenario']} trades={m['trades']} return_pct={m['net_return_pct']} dd_pct={m['max_drawdown_pct']} pf={m['profit_factor']} top1_share_pct={concentration['top_1_share_pct']} top3_share_pct={concentration['top_3_share_pct']} top5_share_pct={concentration['top_5_share_pct']}")
          print("=== TRAIN-ONLY PARAMETER NEIGHBORHOOD ===")
          for item in report["train_only_parameter_neighborhood"]:
              m = item["metrics"]
              print(f"variant={item['variant']} cost={item['cost_scenario']} trades={m['trades']} return_pct={m['net_return_pct']} pf={m['profit_factor']}")
          PY
      - name: Upload raw data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.symbol }}-1h
          path: |
            data/${{ matrix.symbol }}_1h.csv
            data/${{ matrix.symbol }}_1h.csv.manifest.json
            data/${{ matrix.symbol }}_funding.csv
            reports/${{ matrix.symbol }}_1h_baseline.json
            reports/${{ matrix.symbol }}_1h_adaptive.json
            reports/${{ matrix.symbol }}_1h_breakout_retest.json
            reports/${{ matrix.symbol }}_1h_mean_reversion.json
            reports/${{ matrix.symbol }}_1h_frozen_stability.json
            reports/${{ matrix.symbol }}_1h_avax_followup.json
            reports/${{ matrix.symbol }}_funding_audit.json
            reports/${{ matrix.symbol }}_1h_public_strategy_benchmark.json
          if-no-files-found: warn
          retention-days: 30

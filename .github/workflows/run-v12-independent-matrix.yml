name: Run V12 five-coin independent research matrix

on:
  push:
    branches:
      - research/v12-cvd-independent-validation
    paths:
      - ".github/workflows/run-v12-independent-matrix.yml"
      - "research/run_v12_matrix.py"
      - "research/v12_validation.py"

permissions:
  contents: read

jobs:
  research-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Run five-coin V12 + CVD research matrix
        run: |
          END_DATE="$(date -u -d '5 days ago' +%Y-%m-%d)"
          python -m research.run_v12_matrix \
            --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT \
            --start 2025-10-01 \
            --holdout-start 2026-10-01 \
            --end "$END_DATE" \
            --output-dir reports/v12-independent-matrix
      - name: Upload research data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-independent-matrix
          path: reports/v12-independent-matrix/
          if-no-files-found: warn
          retention-days: 30

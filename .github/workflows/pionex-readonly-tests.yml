name: Pionex read-only safety tests

on:
  pull_request:
    paths:
      - "notifications/pionex_*.py"
      - "tests/test_pionex_*.py"
      - ".github/workflows/pionex-readonly-tests.yml"
  push:
    branches:
      - "feature/isolated-alert-contract"
    paths:
      - "notifications/pionex_*.py"
      - "tests/test_pionex_*.py"
      - ".github/workflows/pionex-readonly-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pionex-readonly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-safety-tests:
    name: Offline Pionex read-only tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIONEX_READ_ONLY_ENABLED: "false"
      ALERT_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile read-only modules and tests
        run: python -m compileall -q notifications tests
      - name: Run Pionex offline unit tests
        run: python -m pytest -q -rs tests/test_pionex_*.py

name: Frozen candidate independent confirmation

on:
  push:
    branches: [main]
    paths:
      - "research/funding_data.py"
      - "research/bybit_funding_data.py"
      - "research/bybit_candle_data.py"
      - "research/okx_candle_data.py"
      - "research/okx_funding_data.py"
      - "research/frozen_confirmation.py"
      - "research/funding_audit.py"
      - "tests/test_okx_data_adapters.py"
      - "tests/test_funding_data.py"
      - "tests/test_funding_audit.py"
      - "tests/test_frozen_confirmation.py"
      - ".github/workflows/frozen-confirmation.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive UTC start date (must be 2026-10-01 or later)"
        required: true
        type: string
        default: "2026-10-01"
      end_date:
        description: "Exclusive UTC end date; only fully closed 1H candles are eligible"
        required: true
        type: string
        default: "2026-10-12"

permissions:
  contents: read

jobs:
  confirm:
    name: "${{ matrix.symbol }} frozen confirmation"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, AVAXUSDT]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install httpx; fi

      - name: Run funding provenance regression tests
        run: |
          python -m pytest -q \
            tests/test_funding_data.py \
            tests/test_funding_audit.py \
            tests/test_frozen_confirmation.py

      - name: Validate date inputs and freeze boundary
        env:
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          END_DATE: ${{ inputs.end_date || '2026-10-12' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          start = datetime.strptime(os.environ["START_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc)
          end = datetime.strptime(os.environ["END_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc)
          boundary = datetime(2026, 10, 1, tzinfo=timezone.utc)
          if start < boundary:
              raise SystemExit("confirmation start must be 2026-10-01 UTC or later")
          if end <= start:
              raise SystemExit("end_date must be later than start_date")
          print(f"confirmation_window_utc=[{start.date()}, {end.date()})")
          PY

      - name: Download closed 1H candles with indicator warm-up
        env:
          SYMBOL: ${{ matrix.symbol }}
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          END_DATE: ${{ inputs.end_date || '2026-10-12' }}
        run: |
          # Fetch 300 pre-window hours for causal indicator warm-up. The runner
          # restricts eligible entries to the requested confirmation window.
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          import csv
          from pathlib import Path
          from research.okx_candle_data import download_okx_candles
          symbol = os.environ["SYMBOL"]
          start = datetime.strptime(os.environ["START_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc)
          end = datetime.strptime(os.environ["END_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc)
          warm_start = start - timedelta(hours=300)
          rows = download_okx_candles(symbol, int(warm_start.timestamp()*1000), int(end.timestamp()*1000))
          output = Path(f"data/confirm_{symbol}_1h.csv")
          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=("t", "o", "h", "l", "c", "v", "q"))
              writer.writeheader()
              writer.writerows([{key: row[key] for key in ("t", "o", "h", "l", "c", "v", "q")} for row in rows])
          print(f"candles={len(rows)} warm_start={warm_start.isoformat()} end_exclusive={end.isoformat()}")
          PY

      - name: Download funding records and settlement price provenance
        env:
          SYMBOL: ${{ matrix.symbol }}
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          END_DATE: ${{ inputs.end_date || '2026-10-12' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from research.okx_funding_data import download_okx_funding
          from research.funding_data import save_funding_csv
          start = datetime.strptime(os.environ["START_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc)
          end = datetime.strptime(os.environ["END_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc)
          rows = download_okx_funding(os.environ["SYMBOL"], int(start.timestamp()*1000), int(end.timestamp()*1000))
          normalized = [{key: row[key] for key in ("funding_time", "funding_rate", "mark_price", "symbol", "mark_price_source", "venue")} for row in rows]
          save_funding_csv(normalized, f"data/confirm_{os.environ['SYMBOL']}_funding.csv")
          sources = {}
          for row in rows:
              sources[row["mark_price_source"]] = sources.get(row["mark_price_source"], 0) + 1
          print(f"funding_records={len(rows)} mark_price_sources={sources}")
          PY

      - name: Prepare exact confirmation-window candles for audit
        env:
          SYMBOL: ${{ matrix.symbol }}
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          END_DATE: ${{ inputs.end_date || '2026-10-12' }}
        run: |
          python - <<'PY'
          import csv, os
          from datetime import datetime, timezone
          from pathlib import Path
          start = int(datetime.strptime(os.environ["START_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc).timestamp() * 1000)
          end = int(datetime.strptime(os.environ["END_DATE"], "%Y-%m-%d").replace(tzinfo=timezone.utc).timestamp() * 1000)
          source = Path(f"data/confirm_{os.environ['SYMBOL']}_1h.csv")
          target = Path(f"data/confirm_{os.environ['SYMBOL']}_audit_1h.csv")
          with source.open(newline="", encoding="utf-8") as src, target.open("w", newline="", encoding="utf-8") as dst:
              reader = csv.DictReader(src)
              writer = csv.DictWriter(dst, fieldnames=reader.fieldnames)
              writer.writeheader()
              rows = [row for row in reader if start <= int(row["t"]) < end]
              writer.writerows(rows)
          print(f"audit_window_candles={len(rows)}")
          if not rows:
              raise SystemExit("No candles inside the confirmation window; refusing audit.")
          PY

      - name: Audit confirmation funding provenance and coverage
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python -m research.funding_audit \
            --funding-csv "data/confirm_${SYMBOL}_funding.csv" \
            --candle-csv "data/confirm_${SYMBOL}_audit_1h.csv" \
            --symbol "$SYMBOL" \
            --max-gap-hours 8 \
            --output "reports/confirm_${SYMBOL}_funding_audit.json"
      - name: Run frozen confirmation only
        env:
          SYMBOL: ${{ matrix.symbol }}
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          END_DATE: ${{ inputs.end_date || '2026-10-12' }}
        run: |
          python -m research.frozen_confirmation \
            --symbol "$SYMBOL" \
            --csv "data/confirm_${SYMBOL}_1h.csv" \
            --funding-csv "data/confirm_${SYMBOL}_funding.csv" \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --output "reports/confirm_${SYMBOL}_${START_DATE}_${END_DATE}.json"

      - name: Publish candidate metrics and gate status
        if: always()
        env:
          SYMBOL: ${{ matrix.symbol }}
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          END_DATE: ${{ inputs.end_date || '2026-10-12' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          symbol = os.environ["SYMBOL"]
          report_path = Path(f"reports/confirm_{symbol}_{os.environ['START_DATE']}_{os.environ['END_DATE']}.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not report_path.exists():
              message = f"## {symbol} frozen confirmation\n\n**NO REPORT** — confirmation did not produce a report.\n"
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write(message)
              print(f"::warning::{symbol}: confirmation report missing")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          gates = report.get("gate", {})
          results = report.get("results", {})
          lines = [
              f"## {symbol} frozen confirmation",
              "",
              f"- **Status:** {report.get('status', 'UNKNOWN')}",
              f"- **Window:** {report.get('window_utc', {}).get('start_inclusive')} to {report.get('window_utc', {}).get('end_exclusive')} (end exclusive)",
              f"- **Frozen parameter SHA-256:** `{report.get('frozen_parameters_sha256', 'missing')}`",
              "",
              "| Round-trip cost | Trades | Net return | Max drawdown | Win rate | Profit factor |",
              "|---:|---:|---:|---:|---:|---:|",
          ]
          for name, result in results.items():
              lines.append(
                  f"| {name.removeprefix('round_trip_cost_').removesuffix('pct')}% "
                  f"| {result.get('trades')} "
                  f"| {result.get('net_return_pct')}% "
                  f"| {result.get('max_drawdown_pct')}% "
                  f"| {result.get('win_rate_pct')}% "
                  f"| {result.get('profit_factor')} |"
              )
          lines.extend(["", "### Eligibility gates", "", "| Gate | Result |", "|---|---|"])
          for key, value in gates.items():
              lines.append(f"| {key} | {'PASS' if value is True else 'FAIL' if value is False else value} |")
          failed = [key for key, value in gates.items() if value is False and key != "production_approval"]
          if failed:
              lines.extend(["", f"**Candidate not eligible:** {', '.join(failed)}. CI success means the analysis completed, not that the strategy passed."])
              print(f"::warning::{symbol} candidate failed research gates: {', '.join(failed)}")
          else:
              lines.extend(["", "**Research gates passed. Production approval remains separate and must be explicitly reviewed.**"])
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print(f"summary_written={bool(summary_path)} failed_gates={failed}")
          PY

      - name: Upload confirmation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-confirmation-${{ matrix.symbol }}-${{ inputs.start_date || '2026-10-01' }}-${{ inputs.end_date || '2026-10-12' }}
          path: |
            reports/confirm_${{ matrix.symbol }}_${{ inputs.start_date || '2026-10-01' }}_${{ inputs.end_date || '2026-10-12' }}.json
            reports/confirm_${{ matrix.symbol }}_funding_audit.json
          if-no-files-found: warn
          retention-days: 30

name: Frozen confirmation unit tests

on:
  push:
    paths:
      - "research/frozen_confirmation.py"
      - "research/funding_data.py"
      - "research/run_backtest.py"
      - "research/breakout_retest.py"
      - "research/mean_reversion.py"
      - "tests/test_frozen_confirmation.py"
      - ".github/workflows/frozen-confirmation-tests.yml"
  pull_request:
    paths:
      - "research/frozen_confirmation.py"
      - "research/funding_data.py"
      - "research/run_backtest.py"
      - "research/breakout_retest.py"
      - "research/mean_reversion.py"
      - "tests/test_frozen_confirmation.py"
      - ".github/workflows/frozen-confirmation-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install httpx; fi
      - name: Run frozen confirmation tests
        run: python -m unittest discover -s tests -p 'test_frozen_confirmation.py' -v

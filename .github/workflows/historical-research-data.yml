name: Historical multi-asset research

on:
  push:
    branches: [main]
    paths:
      - "validation/audit_funding_history.py"
      - "validation/audit_research_input_inventory.py"
      - "validation/audit_replay_signals.py"
      - "validation/audit_window_coverage.py"
      - "validation/audit_historical_data.py"
      - "validation/download_funding_rates.py"
      - "validation/download_futures_klines.py"
      - "validation/exit_parameter_audit.py"
      - "validation/run_multi_asset_exit_audit.py"
      - "validation/replay_dashboard_signals.py"
      - ".github/workflows/historical-research-data.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "UTC inclusive start date (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
        type: string
      end_date:
        description: "UTC exclusive end date (YYYY-MM-DD); use a completed-month boundary for public funding archives"
        required: true
        default: "2026-10-01"
        type: string

permissions:
  contents: read

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      START_DATE: ${{ github.event.inputs.start_date || '2025-10-01' }}
      END_DATE: ${{ github.event.inputs.end_date || '2026-10-01' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requested UTC date window
        run: |
          python - <<'PY'
          from datetime import date
          import os
          import re

          start = os.environ["START_DATE"]
          end = os.environ["END_DATE"]
          pattern = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          if not pattern.fullmatch(start) or not pattern.fullmatch(end):
              raise SystemExit("Dates must use exact YYYY-MM-DD format")
          try:
              start_date = date.fromisoformat(start)
              end_date = date.fromisoformat(end)
          except ValueError as exc:
              raise SystemExit(f"Invalid calendar date: {exc}")
          if end_date <= start_date:
              raise SystemExit("END_DATE must be later than START_DATE")
          print(f"Validated UTC window: [{start_date}, {end_date})")
          PY
      - name: Download closed 1h candles
        run: >-
          python validation/download_futures_klines.py
          --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT
          --interval 1h
          --start "$START_DATE"
          --end "$END_DATE"
          --out-dir data/historical
      - name: Download closed 4h candles
        run: >-
          python validation/download_futures_klines.py
          --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT
          --interval 4h
          --start "$START_DATE"
          --end "$END_DATE"
          --out-dir data/historical
      - name: Download historical funding events
        run: >-
          python validation/download_funding_rates.py
          --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT
          --start "$START_DATE"
          --end "$END_DATE"
          --out-dir data/funding
      - name: Diagnose funding-to-candle timestamp alignment
        run: |
          mkdir -p research-results/funding-alignment
          for symbol in BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT; do
            for spec in "1h 3600000" "4h 14400000"; do
              read -r interval interval_ms <<< "$spec"
              python validation/diagnose_funding_alignment.py \
                --candles "data/historical/${symbol}_${interval}.csv" \
                --funding "data/funding/${symbol}_funding.csv" \
                --candle-timestamp-kind close --interval-ms "$interval_ms" \
                > "research-results/funding-alignment/${symbol}_${interval}.json"
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          reports = sorted(Path("research-results/funding-alignment").glob("*.json"))
          if len(reports) != 10:
              raise SystemExit(f"Expected 10 alignment reports, got {len(reports)}")
          for path in reports:
              report = json.loads(path.read_text())
              print(
                  path.name,
                  "candle_rows=", report["candle_rows"],
                  "funding_rows=", report["funding_rows"],
                  "duplicate_candles=", report["duplicate_candle_timestamps"],
                  "duplicate_funding=", report["duplicate_funding_timestamps"],
                  "funding_outside_candle_range=", report["funding_events_outside_candle_timestamp_range"],
                  "first_candle_mod_hour_ms=", report["candle_first_mod_hour_ms"],
                  "first_funding_mod_hour_ms=", report["funding_first_mod_hour_ms"],
              )
          PY
      - name: Enforce strict candle and funding input inventory
        run: |
          mkdir -p research-results
          python validation/audit_research_input_inventory.py \
            --candle-dir data/historical \
            --funding-dir data/funding \
            --start "${START_DATE}T00:00:00Z" \
            --end "${END_DATE}T00:00:00Z" \
            --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT \
            --out research-results/input-inventory.json
          cat research-results/input-inventory.json
      - name: Audit exact requested candle window
        run: |
          python validation/audit_window_coverage.py \
            --data-dir data/historical \
            --start "$START_DATE" --end "$END_DATE" \
            --out research-results/window-coverage.json
          cat research-results/window-coverage.json
      - name: Audit candle integrity
        run: |
          mkdir -p research-results
          python validation/audit_historical_data.py --data-dir data/historical > research-results/candle-integrity.json
          cat research-results/candle-integrity.json
          python -c 'import json; r=json.load(open("research-results/candle-integrity.json")); assert r.get("all_basic_integrity_pass"), "Candle integrity gate failed"'
      - name: Audit funding integrity
        run: |
          python validation/audit_funding_history.py \
            data/funding/BTCUSDT_funding.csv data/funding/ETHUSDT_funding.csv \
            data/funding/SOLUSDT_funding.csv data/funding/AVAXUSDT_funding.csv \
            data/funding/XRPUSDT_funding.csv --max-gap-hours 8 \
            --start "${START_DATE}T00:00:00Z" \
            --end "${END_DATE}T00:00:00Z" \
            > research-results/funding-integrity.json
          cat research-results/funding-integrity.json
          python -c 'import json; r=json.load(open("research-results/funding-integrity.json")); assert r.get("all_basic_integrity_pass"), "Funding integrity gate failed"'
      - name: Replay asset-specific signals
        run: |
          python validation/replay_dashboard_signals.py --data-dir data/historical --out-dir data/replay --include-states
      - name: Audit replay signal consistency
        run: |
          python validation/audit_replay_signals.py \
            --data-dir data/historical --signals-dir data/replay \
            --out research-results/signal-audit.json
          cat research-results/signal-audit.json
      - name: Run cost sensitivity and holdout audits
        run: |
          python validation/run_multi_asset_exit_audit.py \
            --data-dir data/historical --signals-dir data/replay --funding-dir data/funding \
            --out-dir research-results/exit-audits --min-trades 30 \
            > research-results/batch-manifest.json
          cat research-results/batch-manifest.json
      - name: Build readable research summary
        if: always() && hashFiles('research-results/batch-manifest.json') != ''
        run: |
          python validation/summarize_research_report.py \
            --manifest research-results/batch-manifest.json \
            --out research-results/summary.md
          cat research-results/summary.md
      - name: Upload raw data and research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-research-${{ env.START_DATE }}-to-${{ env.END_DATE }}
          path: |
            data/historical/
            data/funding/
            data/replay/
            research-results/
          if-no-files-found: warn
          retention-days: 30
